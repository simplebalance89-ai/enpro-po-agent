# Render.com deployment — enpro-po-agent
# Runtime: Docker (uses Dockerfile in repo root, pinned to Debian 12 bookworm)
# Service is managed via the Render dashboard; this file documents intent only.
services:
  - type: web
    name: enpro-po-agent
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AZURE_BLOB_CONTAINER_NAME
        value: ariba-coupa
      # ── Secrets: set in Render dashboard, never here ──────────────────────
      - key: AZURE_BLOB_CONNECTION_STRING
        sync: false
      - key: DOC_INTEL_ENDPOINT
        sync: false
      - key: DOC_INTEL_KEY
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_KEY
        sync: false
      - key: AZURE_OPENAI_MODEL
        sync: false
      - key: GRAPH_TENANT_ID
        sync: false
      - key: GRAPH_CLIENT_ID
        sync: false
      - key: GRAPH_CLIENT_SECRET
        sync: false
      - key: GRAPH_MAILBOX
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: P21_BASE_URL
        sync: false
      - key: P21_API_USERNAME
        sync: false
      - key: P21_API_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
